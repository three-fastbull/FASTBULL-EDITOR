name: One-time FASTBULL-EDITOR bootstrap

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ github.event.created == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Import verified base and FASTBULL changes
        shell: bash
        run: |
          set -euo pipefail

          printf '%s' '' | base64 --decode > /tmp/fastbull-editor.patch.gz
          echo '66abf8add14bab0c7c5c7f210e935e8a2adea3dd0f315dd3b78c0c87964699d4  /tmp/fastbull-editor.patch.gz' | sha256sum --check -
          gzip --decompress --stdout /tmp/fastbull-editor.patch.gz > /tmp/fastbull-editor.patch

          mkdir /tmp/fastbull-editor
          git -C /tmp/fastbull-editor init
          git -C /tmp/fastbull-editor config user.name 'FASTBULL Automation'
          git -C /tmp/fastbull-editor config user.email 'actions@users.noreply.github.com'
          git -C /tmp/fastbull-editor remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C /tmp/fastbull-editor fetch --no-tags origin "${GITHUB_SHA}"
          git -C /tmp/fastbull-editor checkout -B main FETCH_HEAD

          git -C /tmp/fastbull-editor remote add upstream https://github.com/calesthio/OpenMontage.git
          git -C /tmp/fastbull-editor fetch --no-tags upstream main
          git -C /tmp/fastbull-editor cat-file -e 'cd9f3c1f03368be87b140af494914b8ee4e3c7a4^{commit}'
          git -C /tmp/fastbull-editor merge --allow-unrelated-histories --no-ff --no-commit cd9f3c1f03368be87b140af494914b8ee4e3c7a4
          git -C /tmp/fastbull-editor commit -m 'Import OpenMontage base for FASTBULL-EDITOR'
          git -C /tmp/fastbull-editor am /tmp/fastbull-editor.patch

          git -C /tmp/fastbull-editor rm .github/workflows/bootstrap-fastbull-editor.yml
          git -C /tmp/fastbull-editor commit -m 'Remove one-time bootstrap workflow'
          test "$(git -C /tmp/fastbull-editor rev-parse 'HEAD^{tree}')" = '62d018e729ad160249feb8a45f17dff3a3fe7e81'

          remote_sha="$(git -C /tmp/fastbull-editor ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_sha" = "${GITHUB_SHA}"
          git -C /tmp/fastbull-editor push origin HEAD:main
